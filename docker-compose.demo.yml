
services:
  grafana:
    container_name: oracle-grafana-demo
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_LOG_LEVEL=debug
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=oracle-grafana-datasource
    volumes:
      - ./dist:/var/lib/grafana/plugins/oracle-grafana-datasource:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./demo/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./demo/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

  oracle:
    container_name: oracle-database-demo
    image: gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=oracle_password
      - APP_USER=grafana_demo
      - APP_USER_PASSWORD=oracle_password
    volumes:
      - ./demo/init.sql:/container-entrypoint-initdb.d/init.sql:ro
      - ./demo/init.sql:/opt/oracle/scripts/startup/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s grafana_demo/oracle_password@//localhost:1521/FREEPDB1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s
    restart: unless-stopped
